name: gpt-oss-20b
path: openai/gpt-oss-20b

# Passed to sglang.launch_server. The reasoning parser is what splits the
# reasoning onto its own channel.
serve_args:
  - --dtype
  - bfloat16
  - --reasoning-parser
  - gpt-oss
  - --mem-fraction-static
  - "0.75"

max_tokens: 64000

sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: -1
  presence_penalty: 0
  enable_thinking: true
  separate_reasoning: true
  reasoning_effort: medium

# Sampling this model uses only on certain datasets, merged over `sampling`.
per_dataset:
  lcb:
    temperature: 0.6

post_processor: final_channel

# USD per million tokens.
prices:
  input: 0.03
  output: 0.10
